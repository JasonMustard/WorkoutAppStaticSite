<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <title>Workout Tracker</title>
  <style>
    body{font-family:'Merriweather',Georgia,serif;max-width:760px;margin:0 auto;padding:16px;background:#f5efe6;color:#2a211d;}
    h1{font-family:'Cormorant Garamond','Georgia',serif;color:#7a3e2d;margin:0 0 8px;font-size:2.4rem;letter-spacing:.02em;}
    .card{background:#fff9f2;border:1px solid #d8c7b6;border-radius:12px;padding:16px;margin:12px 0;}
    select,input,textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:6px 0;padding:12px;border-radius:10px;border:1px solid #d8c7b6;}
    button{background:#7a3e2d;color:#fff;border:none;cursor:pointer;}
    button.secondary{background:#8a6a3b;color:#fff;}
    ul{margin:8px 0 0 20px;}
    .small{font-size:14px;color:#5b4b41;}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:sticky;bottom:0;background:#f5efe6;padding:8px 0;}
    .tab{padding:12px 10px;border:2px solid #7a3e2d;border-radius:999px;background:#f0e1d4;color:#5a3025;font-weight:700;}
    .tab.active{background:#7a3e2d;color:#fff;border-color:#7a3e2d;}
    .panel{display:none;}
    .panel.active{display:block;}
    .pill{display:inline-block;background:#ead9cc;color:#7a3e2d;padding:6px 10px;border-radius:999px;font-size:13px;margin-left:8px;}
    pre{white-space:pre-wrap;background:#fafafa;border:1px solid #ddd;border-radius:10px;padding:12px;}
    .tab:focus-visible{outline:3px solid #8a6a3b;outline-offset:2px;}
  </style>
</head>
<body>
  <h1>Workout Tracker</h1>
  <div class="small">30-minute sessions, Sunday off</div>

  <div class="card">
    <label for="daySelect">Workout day</label>
    <select id="daySelect"></select>
    <div id="focusLine" class="small" style="margin-top:8px;"></div>
    <div id="badge" class="pill">Ready</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
      <div style="font-size:32px;font-weight:700;" id="timer">30:00</div>
      <button id="timerBtn" style="width:auto;flex:1;">Start timer</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-panel="today">Today</button>
    <button class="tab" data-panel="stretch">Stretch</button>
    <button class="tab" data-panel="log">Log</button>
    <button class="tab" data-panel="week">Week</button>
  </div>

  <div id="panel-today" class="panel active">
    <div class="card">
      <h2>Workout blocks</h2>
      <div id="blocks"></div>
    </div>
    <div class="card">
      <h2>Quick checks</h2>
      <label><input type="checkbox" id="warmupCheck"> Warm-up done</label><br>
      <label><input type="checkbox" id="gripCheck"> Grip check done</label><br>
      <label><input type="checkbox" id="stretchCheck"> Stretching done</label><br>
      <label><input type="checkbox" id="loggedCheck"> Logged</label>
    </div>
  </div>

  <div id="panel-stretch" class="panel">
    <div class="card">
      <h2>Cool-down</h2>
      <div id="stretchFocus" class="small"></div>
      <ul id="stretchList"></ul>
    </div>
  </div>

  <div id="panel-log" class="panel">
    <div class="card">
      <h2>Quick log</h2>
      <input id="exercise1" placeholder="Exercise 1">
      <input id="result1" placeholder="Sets x reps x load">
      <input id="exercise2" placeholder="Exercise 2">
      <input id="result2" placeholder="Sets x reps x load">
      <input id="exercise3" placeholder="Exercise 3">
      <input id="result3" placeholder="Sets x reps x load">
      <select id="recovery">
        <option>Great</option><option selected>Good</option><option>Fair</option><option>Poor</option>
      </select>
      <textarea id="notes" placeholder="Notes"></textarea>
      <button id="previewBtn" class="secondary">Preview</button>
      <button id="downloadBtn">Download text</button>
      <input id="emailTo" placeholder="Email recipient (optional)">
      <input id="smsTo" placeholder="Text number (optional)">
      <button id="emailBtn" class="secondary">Send email</button>
      <button id="smsBtn" class="secondary">Send text</button>
    </div>
    <div class="card">
      <h2>Preview</h2>
      <pre id="preview">Your workout note will appear here.</pre>
    </div>
  </div>

  <div id="panel-week" class="panel">
    <div class="card">
      <h2>Weekly plan</h2>
      <div id="weekPlan"></div>
    </div>
  </div>

<script>
const plan = [
  {day:'Monday', focus:'Full Body A', badge:'Lift', blocks:['Squat block: goblet squat or back squat, 3 x 8-10','Press block: dumbbell or machine press, 3 x 8-10','Row block: cable or chest-supported row, 3 x 8-10'], stretches:['Hip flexor stretch — 30-45 sec each side','Hamstring hinge and reach — 30 sec each side','Doorway chest stretch — 30-45 sec each side','Thoracic reach-through — 30 sec each side'], stretchFocus:'Hips, hamstrings, chest, and upper back', logExercises:['Goblet squat or back squat','Dumbbell or machine press','Cable or chest-supported row']},
  {day:'Tuesday', focus:'Conditioning + Core', badge:'Condition', blocks:['20 min moderate cardio','Dead bug, Pallof press, plank'], stretches:['Easy walk cooldown — 2-3 min','Hip flexor stretch — 30 sec each side','Child pose breathing — 4-5 breaths'], stretchFocus:'Light whole-body mobility', logExercises:['Cardio machine','Dead bug','Pallof press or plank']},
  {day:'Wednesday', focus:'Full Body B', badge:'Lift', blocks:['Hinge block: RDL or trap-bar deadlift, 3 x 8','Vertical press block: DB shoulder press or landmine press','Vertical pull block: pulldown or assisted pull-up'], stretches:['Hamstring hinge and reach — 30-45 sec each side','Child pose with arm sweep — 8-10 reps','Wall slide — 3 reps of 5 sec each','Lat stretch from child pose — 30 sec each side'], stretchFocus:'Hamstrings, lats, shoulders, and thoracic spine', logExercises:['Romanian deadlift or trap-bar deadlift','DB shoulder press or landmine press','Pulldown or assisted pull-up']},
  {day:'Thursday', focus:'Recovery + Movement', badge:'Recover', blocks:['20 min easy cardio','10 min mobility flow'], stretches:['Hip flexor stretch — 30 sec each side','Thoracic rotation — 5 reps each side','Hamstring floss — 5-8 reps each side'], stretchFocus:'Easy mobility only', logExercises:['Easy cardio','Mobility flow','Recovery note']},
  {day:'Friday', focus:'Full Body C', badge:'Lift', blocks:['Split squat/lunge block: 3 x 8 per side','Incline press block: 3 x 10-12','Row block: cable row or one-arm row, 3 x 10-12'], stretches:['Hip flexor stretch with reach — 30 sec each side','Side pretzel — 30 sec each side','Doorway or kneeling door stretch — 30-60 sec each side','Thoracic reach-through — 30 sec each side'], stretchFocus:'Hip flexors, glutes, chest, and rear shoulder', logExercises:['Reverse lunge or split squat','Incline dumbbell press','Cable row or one-arm row']},
  {day:'Saturday', focus:'Performance / Weak Point', badge:'Build', blocks:['15 min intervals or easy conditioning','15 min technique or accessory work'], stretches:['Easy cooldown walk — 2-3 min','Pick 2 mobility drills based on tight areas'], stretchFocus:'Choose what feels tight', logExercises:['Conditioning block','Technique block','Accessory or weak point']},
  {day:'Sunday', focus:'Off', badge:'Off', blocks:['Rest or easy walk only'], stretches:['Optional easy walk','Light stretching only if it feels good'], stretchFocus:'Recovery day', logExercises:['Rest day','Optional walk','Recovery note']}
];
const daySelect = document.getElementById('daySelect');
const blocks = document.getElementById('blocks');
const stretchList = document.getElementById('stretchList');
const stretchFocus = document.getElementById('stretchFocus');
const focusLine = document.getElementById('focusLine');
const badge = document.getElementById('badge');
const weekPlan = document.getElementById('weekPlan');
const timer = document.getElementById('timer');
let remaining = 1800, running = false, interval = null;

plan.forEach(p => {
  const o = document.createElement('option'); o.value = p.day; o.textContent = p.day + ' — ' + p.focus; daySelect.appendChild(o);
  const box = document.createElement('div'); box.className='card'; box.innerHTML = '<strong>'+p.day+'</strong><div class="small">'+p.focus+'</div><ul>'+p.blocks.map(b=>'<li>'+b+'</li>').join('')+'</ul>'; weekPlan.appendChild(box);
});

function render(day) {
  const p = plan.find(x => x.day === day) || plan[0];
  focusLine.textContent = p.focus;
  badge.textContent = p.badge;
  blocks.innerHTML = '<ul>' + p.blocks.map(b => '<li>' + b + '</li>').join('') + '</ul>';
  stretchFocus.textContent = p.stretchFocus;
  stretchList.innerHTML = p.stretches.map(s => '<li>' + s + '</li>').join('');
  document.getElementById('exercise1').value = p.logExercises[0] || '';
  document.getElementById('exercise2').value = p.logExercises[1] || '';
  document.getElementById('exercise3').value = p.logExercises[2] || '';
}

daySelect.addEventListener('change', () => render(daySelect.value));
render('Monday');

document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
}));

document.getElementById('timerBtn').addEventListener('click', () => {
  if (!running) {
    running = true; document.getElementById('timerBtn').textContent = 'Pause';
    interval = setInterval(() => { if (remaining > 0) { remaining--; const m = String(Math.floor(remaining/60)).padStart(2,'0'); const s = String(remaining%60).padStart(2,'0'); timer.textContent = m + ':' + s; } }, 1000);
  } else {
    running = false; clearInterval(interval); document.getElementById('timerBtn').textContent = 'Start timer';
  }
});

function buildLogText() {
  return [
    'Workout Tracker Log',
    'Day: ' + daySelect.value,
    'Focus: ' + focusLine.textContent,
    'Recovery: ' + document.getElementById('recovery').value,
    'Warm-up done: ' + document.getElementById('warmupCheck').checked,
    'Grip check done: ' + document.getElementById('gripCheck').checked,
    'Stretching done: ' + document.getElementById('stretchCheck').checked,
    'Logged done: ' + document.getElementById('loggedCheck').checked,
    '',
    'Exercise 1: ' + document.getElementById('exercise1').value + ' | ' + document.getElementById('result1').value,
    'Exercise 2: ' + document.getElementById('exercise2').value + ' | ' + document.getElementById('result2').value,
    'Exercise 3: ' + document.getElementById('exercise3').value + ' | ' + document.getElementById('result3').value,
    '',
    'Notes: ' + document.getElementById('notes').value
  ].join('\n');
}

document.getElementById('previewBtn').addEventListener('click', () => document.getElementById('preview').textContent = buildLogText());
document.getElementById('downloadBtn').addEventListener('click', () => {
  const blob = new Blob([buildLogText()], {type:'text/plain'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'workout-log.txt'; a.click(); URL.revokeObjectURL(a.href);
});
document.getElementById('emailBtn').addEventListener('click', () => {
  const to = encodeURIComponent(document.getElementById('emailTo').value || '');
  window.location.href = `mailto:${to}?subject=${encodeURIComponent('Workout log - ' + daySelect.value)}&body=${encodeURIComponent(buildLogText())}`;
});
document.getElementById('smsBtn').addEventListener('click', () => {
  const number = encodeURIComponent(document.getElementById('smsTo').value || '');
  window.location.href = `sms:${number}?body=${encodeURIComponent(buildLogText())}`;
});
</script>
</body>
</html>

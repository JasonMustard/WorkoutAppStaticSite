<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Workout Tracker</title>
  <style>
    :root {
      --bg: #fbfbf8;
      --fg: #20242f;
      --card-bg: rgba(255,255,255,.92);
      --card-border: rgba(132,140,160,.16);
      --card-shadow: rgba(23,27,40,.18);
      --accent: #5b5fd6;
      --accent-soft: #6a7287;
      --accent-strong: #566079;
      --divider: rgba(132,140,160,.10);
      --input-border: rgba(132,140,160,.16);
      --btn-shadow: rgba(91,95,214,.18);
      --modal-backdrop: rgba(24,28,38,.48);
      --secondary-bg: #f2f2f2;
      --secondary-fg: #1d2433;
    }

    @media (prefers-color-scheme: dark) {
      :root[data-theme="light"][data-init="true"] {
        --bg: #050711;
        --fg: #f4f4fb;
        --card-bg: rgba(17,20,38,.96);
        --card-border: rgba(119,126,167,.4);
        --card-shadow: rgba(0,0,0,.65);
        --accent: #9ba5ff;
        --accent-soft: #a7afcf;
        --accent-strong: #dde1ff;
        --divider: rgba(119,126,167,.3);
        --input-border: rgba(119,126,167,.5);
        --btn-shadow: rgba(29,35,96,.65);
        --modal-backdrop: rgba(0,0,0,.72);
        --secondary-bg: #161a2e;
        --secondary-fg: #f4f4fb;
      }
    }

    :root[data-theme="dark"] {
      --bg: #050711;
      --fg: #f4f4fb;
      --card-bg: rgba(17,20,38,.96);
      --card-border: rgba(119,126,167,.4);
      --card-shadow: rgba(0,0,0,.65);
      --accent: #9ba5ff;
      --accent-soft: #a7afcf;
      --accent-strong: #dde1ff;
      --divider: rgba(119,126,167,.3);
      --input-border: rgba(119,126,167,.5);
      --btn-shadow: rgba(29,35,96,.65);
      --modal-backdrop: rgba(0,0,0,.72);
      --secondary-bg: #161a2e;
      --secondary-fg: #f4f4fb;
    }

    :root[data-theme="light"]:not([data-init]) {
      --bg: #fbfbf8;
      --fg: #20242f;
      --card-bg: rgba(255,255,255,.92);
      --card-border: rgba(132,140,160,.16);
      --card-shadow: rgba(23,27,40,.18);
      --accent: #5b5fd6;
      --accent-soft: #6a7287;
      --accent-strong: #566079;
      --divider: rgba(132,140,160,.10);
      --input-border: rgba(132,140,160,.16);
      --btn-shadow: rgba(91,95,214,.18);
      --modal-backdrop: rgba(24,28,38,.48);
      --secondary-bg: #f2f2f2;
      --secondary-fg: #1d2433;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      -webkit-tap-highlight-color: transparent;
    }
    select, input, button { font: inherit; }

    /* Right margin vertical toggle aligned with Workout day card */
    .top-row {
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .vertical-toggle-wrap {
      display: flex;
      align-items: center;
    }

    .vertical-toggle {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      padding: 10px 6px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      background: rgba(0,0,0,0.03);
      backdrop-filter: blur(10px);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-align: center;
      color: var(--accent-strong);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
    }

    select {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      background: #ffffff;
      font-size: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px var(--card-shadow);
    }
    .label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--accent);
      margin: 0 0 12px;
    }
    .line {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--divider);
    }
    .line:last-child { border-bottom: none; }
    .text { flex: 1; font-size: 15px; }
    .block-name {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 4px;
      color: var(--accent);
      letter-spacing: .01em;
    }
    .rep-note {
      font-size: 13px;
      color: var(--accent-soft);
      margin-left: 8px;
      font-weight: 500;
    }
    .exercise-note-input {
      width: 100%;
      padding: 8px 9px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      font-size: 14px;
      color: var(--fg);
      background: transparent;
    }
    .exercise-note-input::placeholder {
      color: var(--accent-soft);
      opacity: 0.7;
    }
    .set-row {
      display: grid;
      grid-template-columns: 26px 46px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--divider);
    }
    .set-row:last-child { border-bottom: none; }
    .set-row input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
    }
    .set-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-strong);
    }
    .set-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .set-weight-input,
    .set-reps-input {
      width: 100%;
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      font-size: 15px;
      background: transparent;
      color: var(--fg);
    }
    .set-weight-input::placeholder,
    .set-reps-input::placeholder {
      color: var(--accent-soft);
      opacity: 0.7;
    }
    .complete-btn {
      width: 100%;
      padding: 18px;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #7b86ff);
      color: #ffffff;
      box-shadow: 0 2px 10px var(--btn-shadow);
    }
    .complete-btn:active { transform: scale(.99); }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--modal-backdrop);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--card-border);
      box-shadow: 0 14px 40px var(--card-shadow);
      color: var(--fg);
    }
    .modal h2 { margin: 0 0 6px; }
    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    .modal-actions.single { grid-template-columns: 1fr; }
    .secondary {
      background: var(--secondary-bg);
      color: var(--secondary-fg);
      border: 1px solid var(--card-border);
    }
    .primary {
      background: linear-gradient(135deg, var(--accent), #7b86ff);
      color: #ffffff;
      border: 1px solid rgba(91,95,214,.18);
    }
    .small { font-size: 13px; color: var(--accent-soft); }
  </style>
</head>
<body>

<div class="top-row">
  <div class="card top-row-card">
    <div class="top-row-inner">
      <div class="top-row-main">
        <label class="label" for="daySelect">Workout day</label>
        <select id="daySelect"></select>
      </div>
      <button id="themeToggle" class="vertical-toggle" aria-label="Toggle theme">
        LIGHT
      </button>
    </div>
  </div>
</div>

  <div class="card">
    <div class="section-title">Warm-up</div>
    <div id="warmupList"></div>
  </div>

  <div id="blocksContainer"></div>

  <div class="card">
    <div class="section-title">Cooldown</div>
    <div id="cooldownList"></div>
  </div>

  <button class="complete-btn" id="completeBtn">Complete</button>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2>Workout complete</h2>
      <div class="small" style="margin-bottom:0;">Send the session log or copy it first.</div>
      <div class="modal-actions">
        <button class="primary" id="sendEmailBtn">Send email</button>
        <button class="secondary" id="copyTextBtn">Copy text</button>
      </div>
      <div class="modal-actions single">
        <button class="secondary" id="closeModalBtn">Close</button>
      </div>
    </div>
  </div>

<script>
const plan = [
  { day:'Monday', focus:'Full Body A', warmup:['5 min easy walk or bike','Arm circles — 10 each direction','Leg swings — 10 each leg','Bodyweight squats — 15 reps','Push-ups — 10 reps'], blocks:[{name:'Goblet squat or back squat', reps:'8-10', sets:3},{name:'Dumbbell or machine press', reps:'8-10', sets:3},{name:'Cable or chest-supported row', reps:'8-10', sets:3}], cooldown:['3 min box breathing','Hip flexor stretch — 30 sec each side','Hamstring stretch — 30 sec each side','Doorway chest stretch — 30 sec each side'] },
  { day:'Tuesday', focus:'Conditioning + Core', warmup:['3 min easy walk','High knees — 30 sec','Butt kicks — 30 sec','Torso twists — 15 each side'], blocks:[{name:'Cardio machine (moderate)', reps:'20 min', sets:1},{name:'Dead bug', reps:'10 each side', sets:3},{name:'Pallof press or plank', reps:'30-45 sec', sets:3}], cooldown:['4 min nasal breathing','Child pose — 45 sec','Cobra or sphinx — 30 sec','Supine twist — 30 sec each side'] },
  { day:'Wednesday', focus:'Full Body B', warmup:['5 min easy walk or bike','Hip circles — 10 each direction','Band pull-aparts — 15 reps','Glute bridges — 15 reps','Cat-cow stretch — 10 reps'], blocks:[{name:'RDL or trap-bar deadlift', reps:'8', sets:3},{name:'DB shoulder press or landmine press', reps:'8-10', sets:3},{name:'Pulldown or assisted pull-up', reps:'8-10', sets:3}], cooldown:['3 min box breathing','Half-kneeling hip flexor stretch — 30 sec each side','Lat stretch — 30 sec each side','Thoracic rotation — 5 each side'] },
  { day:'Thursday', focus:'Recovery + Movement', warmup:['5 min easy walk','Full body stretch — 2 min','Joint rotations — 1 min'], blocks:[{name:'Easy cardio', reps:'20 min', sets:1},{name:'Mobility flow', reps:'10 min', sets:1}], cooldown:['5 min slow breathing','Child pose — 45 sec','Cat-cow — 8 reps','Legs up the wall — 2 min'] },
  { day:'Friday', focus:'Full Body C', warmup:['5 min easy walk or bike','Walking lunges — 10 each leg','Incline push-ups — 10 reps','Band rows — 15 reps','Plank — 30 sec'], blocks:[{name:'Reverse lunge or split squat', reps:'8 each side', sets:3},{name:'Incline dumbbell press', reps:'10-12', sets:3},{name:'Cable row or one-arm row', reps:'10-12', sets:3}], cooldown:['3 min box breathing','Quad stretch — 30 sec each side','Chest stretch — 30 sec each side','Pigeon or figure-4 stretch — 30 sec each side'] },
  { day:'Saturday', focus:'Performance / Weak Point', warmup:['5 min easy cardio','Dynamic stretches — 3 min','Light activation — 2 min'], blocks:[{name:'Intervals or conditioning', reps:'15 min', sets:1},{name:'Technique or accessory work', reps:'15 min', sets:1}], cooldown:['4 min nasal breathing','Pick 2 tight-area stretches','Seated twist — 30 sec each side'] },
  { day:'Sunday', focus:'Off', warmup:['Optional easy walk — 10 min','Light stretching — 5 min'], blocks:[{name:'Rest day', reps:'-', sets:1}], cooldown:['Optional 3 min breathing','Light stretching if needed'] }
];

const daySelect = document.getElementById('daySelect');
const warmupList = document.getElementById('warmupList');
const blocksContainer = document.getElementById('blocksContainer');
const cooldownList = document.getElementById('cooldownList');
const completeBtn = document.getElementById('completeBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const sendEmailBtn = document.getElementById('sendEmailBtn');
const copyTextBtn = document.getElementById('copyTextBtn');
const closeModalBtn = document.getElementById('closeModalBtn');
const themeToggle = document.getElementById('themeToggle');
let latestLog = '';

plan.forEach(p => {
  const o = document.createElement('option');
  o.value = p.day;
  o.textContent = p.day + ' — ' + p.focus;
  daySelect.appendChild(o);
});

function checkId(bi, si){ return `block${bi}_set${si}`; }
function weightId(bi, si){ return `block${bi}_set${si}_weight`; }
function repsId(bi, si){ return `block${bi}_set${si}_reps`; }
function noteId(bi){ return `block${bi}_note`; }

function render(day) {
  const p = plan.find(x => x.day === day) || plan[0];
  warmupList.innerHTML = p.warmup.map(w => `<div class="line"><div class="text">${w}</div></div>`).join('');
  blocksContainer.innerHTML = p.blocks.map((block, bi) => `
    <div class="card">
      <div class="block-name">${block.name}<span class="rep-note">${block.reps}</span></div>
      <input
        type="text"
        id="${noteId(bi)}"
        class="exercise-note-input"
        placeholder="Notes for this exercise (optional)"
      >
      ${Array.from({length:block.sets}, (_, si) => `
        <div class="set-row">
          <input type="checkbox" id="${checkId(bi, si)}">
          <div class="set-label">Set ${si+1}</div>
          <div class="set-inputs">
            <input
              class="set-weight-input"
              id="${weightId(bi, si)}"
              type="number"
              inputmode="numeric"
              pattern="[0-9]*"
              min="0"
              step="5"
              placeholder="lbs"
            >
            <input
              class="set-reps-input"
              id="${repsId(bi, si)}"
              type="number"
              inputmode="numeric"
              pattern="[0-9]*"
              min="0"
              step="1"
              placeholder="reps"
            >
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
  cooldownList.innerHTML = p.cooldown.map(s => `<div class="line"><div class="text">${s}</div></div>`).join('');
}

daySelect.addEventListener('change', () => render(daySelect.value));
render('Monday');

function selectedWeight(bi, si) {
  const el = document.getElementById(weightId(bi, si));
  return el && el.value ? el.value : '0';
}

function selectedReps(bi, si) {
  const el = document.getElementById(repsId(bi, si));
  return el && el.value ? el.value : '0';
}

function buildLogText() {
  const p = plan.find(x => x.day === daySelect.value);
  let log = 'WORKOUT LOG\n';
  log += 'Date: ' + new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'short', day:'numeric' }) + '\n';
  log += 'Day: ' + daySelect.value + ' — ' + p.focus + '\n\n';
  log += '--- WARM-UP ---\n';
  p.warmup.forEach(w => { log += '[ ] ' + w + '\n'; });
  log += '\n--- WORKOUT ---\n';
  let totalSets = 0, completedSets = 0;
  p.blocks.forEach((block, bi) => {
    log += '\n' + block.name + ' (' + block.reps + ')\n';
    const noteEl = document.getElementById(noteId(bi));
    const note = noteEl && noteEl.value ? noteEl.value.trim() : '';
    if (note) {
      log += '  Note: ' + note + '\n';
    }
    for (let si = 0; si < block.sets; si++) {
      const checked = document.getElementById(checkId(bi, si)).checked;
      const weight = selectedWeight(bi, si);
      const reps = selectedReps(bi, si);
      log += (checked ? '  [✓]' : '  [ ]') +
        ' Set ' + (si+1) + ': ' + weight + ' lbs x ' + reps + ' reps\n';
      totalSets++;
      if (checked) completedSets++;
    }
  });
  log += '\n--- COOLDOWN ---\n';
  (p.cooldown || []).forEach(s => { log += '[ ] ' + s + '\n'; });
  log += '\n--- SUMMARY ---\n';
  log += 'Sets complete: ' + completedSets + '/' + totalSets + '\n';
  return log;
}

completeBtn.addEventListener('click', () => {
  latestLog = buildLogText();
  modalBackdrop.style.display = 'flex';
});

sendEmailBtn.addEventListener('click', () => {
  const subject = encodeURIComponent('Workout Log - ' + daySelect.value);
  const body = encodeURIComponent(latestLog || buildLogText());
  window.location.href = 'mailto:jdmustard@icloud.com?subject=' + subject + '&body=' + body;
});

copyTextBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(latestLog || buildLogText());
    copyTextBtn.textContent = 'Copied';
    setTimeout(() => copyTextBtn.textContent = 'Copy text', 1200);
  } catch(e) {
    alert('Copy failed on this device.');
  }
});

closeModalBtn.addEventListener('click', () => modalBackdrop.style.display = 'none');
modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) modalBackdrop.style.display = 'none';
});

/* Light / Dark toggle (vertical text, no system) */
const htmlEl = document.documentElement;
const storedTheme = localStorage.getItem('theme');

if (storedTheme === 'dark' || storedTheme === 'light') {
  htmlEl.setAttribute('data-theme', storedTheme);
}
htmlEl.setAttribute('data-init', 'true');

function updateToggleText() {
  const current = htmlEl.getAttribute('data-theme') || 'light';
  themeToggle.textContent = current === 'dark' ? 'DARK' : 'LIGHT';
}

updateToggleText();

themeToggle.addEventListener('click', () => {
  const current = htmlEl.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  htmlEl.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateToggleText();
});
</script>
</body>
</html>

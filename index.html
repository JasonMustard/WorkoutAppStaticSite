<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Workout Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #f5f5f5; color: #1a1a1a; -webkit-tap-highlight-color: transparent; }
    h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 16px; }
    .card { background: #fff; border: 1px solid #e2e2e2; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #666; margin-bottom: 8px; }
    select, input, button { font: inherit; }
    select { width: 100%; padding: 14px; border: 1px solid #d0d0d0; border-radius: 10px; background: #fff; font-size: 16px; }
    .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #666; margin: 0 0 12px; }
    .line { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .line:last-child { border-bottom: none; }
    .text { flex: 1; font-size: 15px; }
    .block-name { font-size: 16px; font-weight: 700; margin: 0 0 8px; }
    .rep-note { font-size: 13px; color: #777; margin-left: 8px; font-weight: 500; }
    .set-row { display: grid; grid-template-columns: 26px 46px 1fr 60px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
    .set-row:last-child { border-bottom: none; }
    .set-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: #2e7d32; }
    .set-label { font-size: 14px; font-weight: 600; color: #666; }
    .wheel-wrap { position: relative; height: 170px; overflow: hidden; border-radius: 14px; background: linear-gradient(to bottom, rgba(245,245,245,1), rgba(255,255,255,1) 18%, rgba(255,255,255,1) 82%, rgba(245,245,245,1)); border: 1px solid #dfe3df; }
    .wheel-wrap::before, .wheel-wrap::after { content: ''; position: absolute; left: 0; right: 0; height: 56px; pointer-events: none; z-index: 2; }
    .wheel-wrap::before { top: 0; background: linear-gradient(to bottom, rgba(245,245,245,.98), rgba(245,245,245,0)); }
    .wheel-wrap::after { bottom: 0; background: linear-gradient(to top, rgba(245,245,245,.98), rgba(245,245,245,0)); }
    .wheel-center { position: absolute; left: 0; right: 0; top: 50%; height: 38px; margin-top: -19px; border-top: 1px solid rgba(46,125,50,.25); border-bottom: 1px solid rgba(46,125,50,.25); background: rgba(46,125,50,.05); z-index: 1; }
    .wheel { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 66px 0; }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel-item { height: 38px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; color: #888; font-size: 15px; font-weight: 600; }
    .wheel-item.selected { color: #2e7d32; font-size: 18px; font-weight: 800; }
    .complete-btn { width: 100%; padding: 18px; font-size: 17px; font-weight: 700; border: none; border-radius: 14px; background: #2e7d32; color: #fff; box-shadow: 0 2px 10px rgba(46,125,50,.28); }
    .complete-btn:active { transform: scale(.99); }
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); align-items: center; justify-content: center; padding: 16px; z-index: 999; }
    .modal { width: 100%; max-width: 520px; background: #fff; border-radius: 16px; padding: 18px; border: 1px solid #e2e2e2; box-shadow: 0 14px 40px rgba(0,0,0,.22); }
    .modal h2 { margin: 0 0 6px; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .modal-actions.single { grid-template-columns: 1fr; }
    .secondary { background: #f2f2f2; color: #1a1a1a; border: 1px solid #ddd; }
    .primary { background: #2e7d32; color: #fff; border: none; }
    .small { font-size: 13px; color: #777; }
  </style>
</head>
<body>
  <h1>Workout Tracker</h1>
  <div class="subtitle">Mobile-first logging for the gym</div>

  <div class="card">
    <label class="label" for="daySelect">Workout day</label>
    <select id="daySelect"></select>
  </div>

  <div class="card">
    <div class="section-title">Warm-up</div>
    <div id="warmupList"></div>
  </div>

  <div id="blocksContainer"></div>

  <div class="card">
    <div class="section-title">Cooldown</div>
    <div id="cooldownList"></div>
  </div>

  <button class="complete-btn" id="completeBtn">Complete</button>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2>Workout complete</h2>
      <div class="subtitle" style="margin-bottom:0;">Send the session log or copy it first.</div>
      <div class="modal-actions">
        <button class="primary" id="sendEmailBtn">Send email</button>
        <button class="secondary" id="copyTextBtn">Copy text</button>
      </div>
      <div class="modal-actions single">
        <button class="secondary" id="closeModalBtn">Close</button>
      </div>
    </div>
  </div>

<script>
const plan = [
  { day:'Monday', focus:'Full Body A', warmup:['5 min easy walk or bike','Arm circles — 10 each direction','Leg swings — 10 each leg','Bodyweight squats — 15 reps','Push-ups — 10 reps'], blocks:[{name:'Goblet squat or back squat', reps:'8-10', sets:3},{name:'Dumbbell or machine press', reps:'8-10', sets:3},{name:'Cable or chest-supported row', reps:'8-10', sets:3}], cooldown:['3 min box breathing','Hip flexor stretch — 30 sec each side','Hamstring stretch — 30 sec each side','Doorway chest stretch — 30 sec each side'] },
  { day:'Tuesday', focus:'Conditioning + Core', warmup:['3 min easy walk','High knees — 30 sec','Butt kicks — 30 sec','Torso twists — 15 each side'], blocks:[{name:'Cardio machine (moderate)', reps:'20 min', sets:1},{name:'Dead bug', reps:'10 each side', sets:3},{name:'Pallof press or plank', reps:'30-45 sec', sets:3}], cooldown:['4 min nasal breathing','Child pose — 45 sec','Cobra or sphinx — 30 sec','Supine twist — 30 sec each side'] },
  { day:'Wednesday', focus:'Full Body B', warmup:['5 min easy walk or bike','Hip circles — 10 each direction','Band pull-aparts — 15 reps','Glute bridges — 15 reps','Cat-cow stretch — 10 reps'], blocks:[{name:'RDL or trap-bar deadlift', reps:'8', sets:3},{name:'DB shoulder press or landmine press', reps:'8-10', sets:3},{name:'Pulldown or assisted pull-up', reps:'8-10', sets:3}], cooldown:['3 min box breathing','Half-kneeling hip flexor stretch — 30 sec each side','Lat stretch — 30 sec each side','Thoracic rotation — 5 each side'] },
  { day:'Thursday', focus:'Recovery + Movement', warmup:['5 min easy walk','Full body stretch — 2 min','Joint rotations — 1 min'], blocks:[{name:'Easy cardio', reps:'20 min', sets:1},{name:'Mobility flow', reps:'10 min', sets:1}], cooldown:['5 min slow breathing','Child pose — 45 sec','Cat-cow — 8 reps','Legs up the wall — 2 min'] },
  { day:'Friday', focus:'Full Body C', warmup:['5 min easy walk or bike','Walking lunges — 10 each leg','Incline push-ups — 10 reps','Band rows — 15 reps','Plank — 30 sec'], blocks:[{name:'Reverse lunge or split squat', reps:'8 each side', sets:3},{name:'Incline dumbbell press', reps:'10-12', sets:3},{name:'Cable row or one-arm row', reps:'10-12', sets:3}], cooldown:['3 min box breathing','Quad stretch — 30 sec each side','Chest stretch — 30 sec each side','Pigeon or figure-4 stretch — 30 sec each side'] },
  { day:'Saturday', focus:'Performance / Weak Point', warmup:['5 min easy cardio','Dynamic stretches — 3 min','Light activation — 2 min'], blocks:[{name:'Intervals or conditioning', reps:'15 min', sets:1},{name:'Technique or accessory work', reps:'15 min', sets:1}], cooldown:['4 min nasal breathing','Pick 2 tight-area stretches','Seated twist — 30 sec each side'] },
  { day:'Sunday', focus:'Off', warmup:['Optional easy walk — 10 min','Light stretching — 5 min'], blocks:[{name:'Rest day', reps:'-', sets:1}], cooldown:['Optional 3 min breathing','Light stretching if needed'] }
];

const daySelect = document.getElementById('daySelect');
const warmupList = document.getElementById('warmupList');
const blocksContainer = document.getElementById('blocksContainer');
const cooldownList = document.getElementById('cooldownList');
const completeBtn = document.getElementById('completeBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const sendEmailBtn = document.getElementById('sendEmailBtn');
const copyTextBtn = document.getElementById('copyTextBtn');
const closeModalBtn = document.getElementById('closeModalBtn');
let latestLog = '';

const weights = Array.from({length: 61}, (_, i) => i * 5);

plan.forEach(p => {
  const o = document.createElement('option');
  o.value = p.day;
  o.textContent = p.day + ' — ' + p.focus;
  daySelect.appendChild(o);
});

function checkId(bi, si){ return `block${bi}_set${si}`; }
function wheelId(bi, si){ return `block${bi}_set${si}_wheel`; }
function labelId(bi, si){ return `block${bi}_set${si}_label`; }

function renderWheel(bi, si) {
  return `
    <div class="wheel-wrap">
      <div class="wheel-center"></div>
      <div class="wheel" id="${wheelId(bi, si)}">
        ${weights.map(w => `<div class="wheel-item" data-value="${w}">${w}</div>`).join('')}
      </div>
    </div>
  `;
}

function bindWheel(wheelEl, labelEl) {
  const items = [...wheelEl.querySelectorAll('.wheel-item')];
  const selectNearest = () => {
    const center = wheelEl.scrollTop + wheelEl.clientHeight / 2;
    let best = items[0], bestDist = Infinity;
    items.forEach(item => {
      const mid = item.offsetTop + item.offsetHeight / 2;
      const dist = Math.abs(mid - center);
      if (dist < bestDist) { bestDist = dist; best = item; }
    });
    items.forEach(i => i.classList.remove('selected'));
    best.classList.add('selected');
    labelEl.textContent = best.dataset.value;
  };
  wheelEl.addEventListener('scroll', () => {
    clearTimeout(wheelEl._t);
    wheelEl._t = setTimeout(selectNearest, 80);
  });
  setTimeout(() => {
    const target = items.find(i => i.dataset.value === '0') || items[0];
    wheelEl.scrollTop = target.offsetTop - wheelEl.clientHeight / 2 + target.offsetHeight / 2;
    selectNearest();
  }, 0);
}

function render(day) {
  const p = plan.find(x => x.day === day) || plan[0];
  warmupList.innerHTML = p.warmup.map(w => `<div class="line"><div class="text">${w}</div></div>`).join('');
  blocksContainer.innerHTML = p.blocks.map((block, bi) => `
    <div class="card">
      <div class="block-name">${block.name}<span class="rep-note">${block.reps}</span></div>
      ${Array.from({length:block.sets}, (_, si) => `
        <div class="set-row">
          <input type="checkbox" id="${checkId(bi, si)}">
          <div class="set-label">Set ${si+1}</div>
          <div>${renderWheel(bi, si)}</div>
          <div class="weight-value" id="${labelId(bi, si)}">0</div>
        </div>
      `).join('')}
    </div>
  `).join('');
  cooldownList.innerHTML = p.cooldown.map(s => `<div class="line"><div class="text">${s}</div></div>`).join('');

  p.blocks.forEach((block, bi) => {
    for (let si = 0; si < block.sets; si++) {
      const wheelEl = document.getElementById(wheelId(bi, si));
      const labelEl = document.getElementById(labelId(bi, si));
      bindWheel(wheelEl, labelEl);
    }
  });
}

daySelect.addEventListener('change', () => render(daySelect.value));
render('Monday');

function selectedWeight(bi, si) {
  const label = document.getElementById(labelId(bi, si));
  return label ? label.textContent : '0';
}

function buildLogText() {
  const p = plan.find(x => x.day === daySelect.value);
  let log = 'WORKOUT LOG\n';
  log += 'Date: ' + new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'short', day:'numeric' }) + '\n';
  log += 'Day: ' + daySelect.value + ' — ' + p.focus + '\n\n';
  log += '--- WARM-UP ---\n';
  p.warmup.forEach(w => { log += '[ ] ' + w + '\n'; });
  log += '\n--- WORKOUT ---\n';
  let totalSets = 0, completedSets = 0;
  p.blocks.forEach((block, bi) => {
    log += '\n' + block.name + ' (' + block.reps + ')\n';
    for (let si = 0; si < block.sets; si++) {
      const checked = document.getElementById(checkId(bi, si)).checked;
      const weight = selectedWeight(bi, si);
      log += (checked ? '  [✓]' : '  [ ]') + ' Set ' + (si+1) + ': ' + weight + ' lbs\n';
      totalSets++;
      if (checked) completedSets++;
    }
  });
  log += '\n--- COOLDOWN ---\n';
  (p.cooldown || []).forEach(s => { log += '[ ] ' + s + '\n'; });
  log += '\n--- SUMMARY ---\n';
  log += 'Sets complete: ' + completedSets + '/' + totalSets + '\n';
  return log;
}

completeBtn.addEventListener('click', () => {
  latestLog = buildLogText();
  modalBackdrop.style.display = 'flex';
});

sendEmailBtn.addEventListener('click', () => {
  const subject = encodeURIComponent('Workout Log - ' + daySelect.value);
  const body = encodeURIComponent(latestLog || buildLogText());
  window.location.href = 'mailto:jdmustard@icloud.com?subject=' + subject + '&body=' + body;
});

copyTextBtn.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(latestLog || buildLogText()); copyTextBtn.textContent = 'Copied'; setTimeout(() => copyTextBtn.textContent = 'Copy text', 1200); }
  catch(e) { alert('Copy failed on this device.'); }
});

closeModalBtn.addEventListener('click', () => modalBackdrop.style.display = 'none');
modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) modalBackdrop.style.display = 'none'; });
</script>
</body>
</html>
